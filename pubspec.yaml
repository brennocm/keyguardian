name: atividade_01
description: "KeyGuardian."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase 
  firebase_core: ^2.31.1
  firebase_auth: ^4.19.6
  cloud_firestore: ^4.17.4
  
  # Gerenciamento de Estado (Requisito de 3 Camadas)
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  
  # Serviços (Para Criptografia e API)
  http: ^1.6.0
  pointycastle: ^3.9.1
  flutter_secure_storage: ^9.1.1
  crypto: ^3.0.7

  google_fonts: ^6.2.1
  
  # Ícones 
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/icon-with-name.png
    - assets/images/icon-without-name.png

